<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BILLY'S SHIRTS 🏭</title>
    <style>
        :root { font-size: 21px; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ff0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        header {
            width: 100%;
            text-align: center;
            padding: 16px;
            background: linear-gradient(90deg, #ff0, #f80, #ff0);
            color: #000;
            font-size: 1.8rem;
            font-weight: 700;
        }
        #game-container {
            position: relative;
            margin: 12px;
            border: 6px solid #ff0;
            border-radius: 22px;
            box-shadow: 0 0 60px #ff0;
            overflow: hidden;
        }
        canvas { display: block; background: #111; }
        .overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15,15,25,0.97);
            padding: 40px 50px;
            border-radius: 20px;
            border: 5px solid #ff0;
            text-align: center;
            display: none;
            flex-direction: column;
            gap: 22px;
            min-width: 320px;
        }
        button {
            background: linear-gradient(135deg, #ff0, #f80);
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 1.45rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            min-height: 72px;
        }
        .score, .highscore { position: absolute; background: rgba(0,0,0,0.8); padding: 10px 24px; border-radius: 999px; font-weight: 700; border: 3px solid #ff0; }
        .score { top: 22px; left: 22px; font-size: 1.45rem; color: #ff0; }
        .highscore { top: 22px; right: 22px; font-size: 1.1rem; color: #0ff; }
        .instructions { position: absolute; bottom: 22px; text-align: center; font-size: 1rem; color: #aaa; width: 100%; }
    </style>
</head>
<body>
    <header>BILLY'S SHIRTS 🏭</header>
    
    <div id="game-container">
        <div class="score" id="score">0m</div>
        <div class="highscore" id="highscore">HI 0m</div>
        <canvas id="canvas" width="520" height="520"></canvas>
        
        <div id="overlay" class="overlay">
            <h2 id="title">BILLY'S SHIRTS</h2>
            <div id="subtitle" style="color:#ff0; font-size:1.55rem;">Run the factory!</div>
            <button onclick="startGame()">START RUNNING!</button>
        </div>
    </div>

    <div class="instructions">
        ↑ JUMP &nbsp;&nbsp;&nbsp; ← → SWITCH LANE &nbsp;&nbsp;&nbsp; SPACE = PAUSE
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highEl = document.getElementById('highscore');
        const overlay = document.getElementById('overlay');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');

        let audioContext;
        function initAudio() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            initAudio();
            const now = audioContext.currentTime;
            if (type === 'jump') {
                const o = audioContext.createOscillator();
                o.type = 'sine'; o.frequency.setValueAtTime(520, now);
                o.frequency.exponentialRampToValueAtTime(920, now + 0.3);
                const g = audioContext.createGain();
                g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                o.connect(g).connect(audioContext.destination);
                o.start(now); o.stop(now + 0.45);
            }
            if (type === 'collect') {
                const notes = [720, 920, 1240];
                notes.forEach((f,i) => setTimeout(() => {
                    const osc = audioContext.createOscillator();
                    osc.type = 'triangle'; osc.frequency.value = f;
                    const gain = audioContext.createGain();
                    gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    osc.connect(gain).connect(audioContext.destination);
                    osc.start(now + i*0.04); osc.stop(now + i*0.04 + 0.5);
                }, i*35));
            }
            if (type === 'crash') {
                const noise = audioContext.createBufferSource();
                const buf = audioContext.createBuffer(1, audioContext.sampleRate * 0.9, audioContext.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < buf.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buf;
                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(1200, now);
                const gain = audioContext.createGain();
                gain.gain.setValueAtTime(1.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 1);
                noise.connect(filter).connect(gain).connect(audioContext.destination);
                noise.start(now);
            }
        }

        let player = { lane: 1, y: 0, vy: 0, jumping: false, runFrame: 0 };
        let obstacles = [], shirts = [], particles = [];
        let distance = 0, speed = 6;
        let gameRunning = false, paused = false;
        let gameInterval;
        let highScore = localStorage.getItem('billyShirtsHigh') || 0;

        const LANES = [140, 260, 380];

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10 - 3;
                this.life = 35; this.maxLife = 35;
                this.color = color; this.size = 5;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.3; this.life--; this.size *= 0.96; }
            draw() {
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12; ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function createExplosion(x, y, color, count = 35) {
            for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
        }

        function spawnObstacle() {
            if (Math.random() < 0.08) {
                obstacles.push({ lane: Math.floor(Math.random()*3), x: 520, type: Math.random() < 0.5 ? 'box' : 'machine' });
            }
        }

        function spawnShirt() {
            if (Math.random() < 0.55) {
                shirts.push({ lane: Math.floor(Math.random()*3), x: 520, color: ['#f00','#0f0','#00f','#ff0'][Math.floor(Math.random()*4)] });
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,520,520);
            
            // Factory walls
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, 520, 380);
            
            // Conveyor floor
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 380, 520, 140);
            
            // Scrolling lines
            const scroll = (Date.now() / 6) % 80;
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 8;
            for (let i = -100; i < 700; i += 80) {
                ctx.beginPath();
                ctx.moveTo(i + scroll, 400);
                ctx.lineTo(i + scroll + 50, 400);
                ctx.stroke();
            }
        }

        function drawPlayer() {
            const x = LANES[player.lane];
            const y = 340 + player.y;
            const bob = player.jumping ? 0 : Math.sin(Date.now()/100) * 3;
            
            ctx.shadowBlur = 25; ctx.shadowColor = '#ff0';
            
            // Legs
            ctx.fillStyle = '#28a';
            ctx.fillRect(x-18, y-20 + bob, 12, 35);
            ctx.fillRect(x+6, y-20 + bob, 12, 35);
            
            // Body
            ctx.fillRect(x-22, y-55, 44, 40);
            
            // Head
            ctx.fillStyle = '#fdb';
            ctx.beginPath(); ctx.arc(x, y-68, 17, 0, Math.PI*2); ctx.fill();
            
            // Hat
            ctx.fillStyle = '#f00';
            ctx.fillRect(x-19, y-82, 38, 14);
        }

        function drawObstacles() {
            obstacles.forEach(o => {
                const x = o.x;
                if (o.type === 'box') {
                    ctx.fillStyle = '#842';
                    ctx.fillRect(x-28, 360, 56, 50);
                    ctx.fillStyle = '#ff0';
                    ctx.fillRect(x-25, 365, 50, 8);
                } else {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(x-32, 320, 64, 90);
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(x-25, 335, 50, 18);
                }
            });
        }

        function drawShirts() {
            shirts.forEach(s => {
                if (s.collected) return;
                const x = s.x;
                ctx.fillStyle = s.color;
                ctx.fillRect(x-18, 260, 36, 32);
                ctx.fillStyle = '#fff';
                ctx.fillRect(x-18, 260, 36, 10);
            });
        }

        function update() {
            if (!gameRunning || paused) return;

            if (distance > 600) speed = 7.4;
            if (distance > 1400) speed = 8.8;
            if (distance > 2400) speed = 10.5;

            distance += speed / 4;
            scoreEl.textContent = Math.floor(distance) + 'm';

            obstacles.forEach(o => o.x -= speed);
            shirts.forEach(s => s.x -= speed);

            obstacles = obstacles.filter(o => o.x > -80);
            shirts = shirts.filter(s => s.x > -50);

            if (player.jumping) {
                player.vy += 0.9;
                player.y += player.vy;
                if (player.y >= 0) { player.y = 0; player.jumping = false; player.vy = 0; }
            }

            if (Math.random() < 0.08) spawnObstacle();
            if (Math.random() < 0.52) spawnShirt();

            const px = LANES[player.lane];
            obstacles.forEach(o => {
                if (o.x < px + 32 && o.x + 50 > px - 32 && player.y > -35) {
                    createExplosion(px, 370, '#f44', 60);
                    playSound('crash');
                    gameOver();
                }
            });

            shirts.forEach(s => {
                if (!s.collected && s.x < px + 32 && s.x + 25 > px - 32 && Math.abs(player.y) < 55) {
                    s.collected = true;
                    createExplosion(s.x, 265, s.color, 35);
                    playSound('collect');
                    distance += 32;
                }
            });

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, 520, 520);
            drawBackground();
            drawObstacles();
            drawShirts();
            drawPlayer();

            particles.forEach(p => { p.update(); p.draw(); });
            for (let i = particles.length-1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i,1);
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            if (distance > highScore) {
                highScore = Math.floor(distance);
                localStorage.setItem('billyShirtsHigh', highScore);
                highEl.textContent = `HI ${highScore}m`;
            }
            title.textContent = "FACTORY SHUTDOWN";
            subtitle.innerHTML = `You folded <b>${Math.floor(distance)}m</b>!`;
            overlay.style.display = 'flex';
        }

        function startGame() {
            initAudio();
            overlay.style.display = 'none';
            distance = 0; speed = 6;
            obstacles = []; shirts = []; particles = [];
            player = { lane: 1, y: 0, vy: 0, jumping: false };
            scoreEl.textContent = '0m';
            gameRunning = true; paused = false;
            draw();
            gameInterval = setInterval(update, 1000/65);
        }

        function togglePause() {
            if (!gameRunning) return;
            paused = !paused;
            if (paused) {
                clearInterval(gameInterval);
                title.textContent = "PAUSED";
                subtitle.innerHTML = `Distance: <b>${Math.floor(distance)}m</b>`;
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
                gameInterval = setInterval(update, 1000/65);
            }
        }

        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowLeft': if (player.lane > 0) player.lane--; break;
                case 'ArrowRight': if (player.lane < 2) player.lane++; break;
                case 'ArrowUp':
                    if (!player.jumping) {
                        player.jumping = true;
                        player.vy = -19;
                        playSound('jump');
                    }
                    break;
                case ' ': togglePause(); break;
            }
        });

        window.onload = () => {
            draw();
            overlay.style.display = 'flex';
            highEl.textContent = `HI ${highScore}m`;
        };
    </script>
</body>
</html>
